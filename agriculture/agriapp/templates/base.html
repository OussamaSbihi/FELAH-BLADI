{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FELAH BLADI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5efe6; /* same as your logo background */
            font-family: 'Segoe UI', sans-serif;
        }

        nav {
            background-color: #2f4f2f; /* dark green tone to match logo */
        }

        nav a, nav .navbar-brand {
            color: white !important;
            font-weight: 600;
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #2f4f2f;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">FELAH BLADI</a>
        </div>
    </nav>

    <div class="container mt-5">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        © 2025 FELAH BLADI - All Rights Reserved
    </footer>
</body>
</html>
